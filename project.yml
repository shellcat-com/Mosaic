name: Mosaic
options:
  bundleIdPrefix: com.mosaic
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SUPABASE_URL: ""
    SUPABASE_PUBLISHABLE_KEY: ""
    REVENUECAT_PUBLIC_SDK_KEY: ""
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.82.0
targets:
  Mosaic:
    type: application
    platform: iOS
    info:
      path: Mosaic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mosaic
        NSCameraUsageDescription: Mosaic uses the camera for private evidence and moments you explicitly seal into a group reveal.
        NSMicrophoneUsageDescription: Mosaic uses the microphone only while recording a private evidence video.
        NSPhotoLibraryUsageDescription: Choose a photo for private evidence or a moment you explicitly add to a group reveal.
        NSPhotoLibraryAddUsageDescription: Save your finished Mosaic recap to Photos.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.mosaic.kindness
            CFBundleURLSchemes:
              - mosaic
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        RevenueCatPublicSDKKey: $(REVENUECAT_PUBLIC_SDK_KEY)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Fraunces72ptSoft-Regular.ttf
          - Fraunces72ptSoft-SemiBold.ttf
          - Fraunces72ptSoft-Bold.ttf
    sources:
      - path: Mosaic
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
      - package: RevenueCat
        product: RevenueCatUI
      - target: MosaicWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mosaic.kindness
        CODE_SIGN_ENTITLEMENTS: Mosaic/Resources/Mosaic.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          REVENUECAT_PUBLIC_SDK_KEY: $(REVENUECAT_TEST_STORE_PUBLIC_KEY)
        Release:
          REVENUECAT_PUBLIC_SDK_KEY: $(REVENUECAT_APP_STORE_PUBLIC_KEY)
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.Push:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
    scheme:
      testTargets:
        - MosaicTests
  MosaicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MosaicTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Mosaic
  MosaicWidgets:
    type: app-extension
    platform: iOS
    info:
      path: MosaicWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    sources:
      - path: MosaicWidgets
      - path: Mosaic/Shared/EventModels.swift
      - path: Mosaic/Shared/MosaicActivityAttributes.swift
      - path: Mosaic/Shared/MosaicEventCache.swift
      - path: Mosaic/Features/Themes/KinderTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mosaic.kindness.widgets
        CODE_SIGN_ENTITLEMENTS: MosaicWidgets/MosaicWidgets.entitlements
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
