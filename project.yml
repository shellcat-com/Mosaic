name: Mosaic
options:
  bundleIdPrefix: com.mosaic
  postGenCommand: ./scripts/fix_xcodegen_capabilities.sh
  deploymentTarget:
    iOS: "18.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    SUPABASE_URL: https://lmemddtpwfbkawlkwthf.supabase.co
    SUPABASE_PUBLISHABLE_KEY: sb_publishable_8qeng2xEiQUxUyzkNMQ_pA_6j1rQsGU
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.82.0
targets:
  Mosaic:
    type: application
    platform: iOS
    info:
      path: Mosaic/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mosaic
        NSCameraUsageDescription: Mosaic uses the camera to capture photos for an event's sealed disposable roll.
        NSPhotoLibraryAddUsageDescription: Save the photo recap you create to Photos.
        ITSAppUsesNonExemptEncryption: true
        CFBundleURLTypes:
          - CFBundleURLName: com.biswaskhatiwada.mosaicapp
            CFBundleURLSchemes:
              - mosaic
        SupabaseURL: $(SUPABASE_URL)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
        RevenueCatPublicSDKKey: $(REVENUECAT_PUBLIC_SDK_KEY)
        MosaicBillingEnabled: $(MOSAIC_BILLING_ENABLED)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIAppFonts:
          - Fraunces72ptSoft-Regular.ttf
          - Fraunces72ptSoft-SemiBold.ttf
          - Fraunces72ptSoft-Bold.ttf
    sources:
      - path: MosaicV3
      - path: Mosaic/DesignSystem/MosaicTheme.swift
      - path: Mosaic/Services/DisposableCameraFilter.swift
      - path: Mosaic/Resources
        excludes:
          - Fonts/Fraunces-OFL.txt
          - "**/*.icloud-backup"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: RevenueCat
        product: RevenueCat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.biswaskhatiwada.mosaicapp
        DEVELOPMENT_TEAM: KFH848D5D7
        CODE_SIGN_ENTITLEMENTS: Mosaic/Resources/Mosaic.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          REVENUECAT_PUBLIC_SDK_KEY: $(REVENUECAT_TEST_STORE_PUBLIC_KEY)
          MOSAIC_BILLING_ENABLED: YES
        Release:
          REVENUECAT_PUBLIC_SDK_KEY: $(REVENUECAT_APP_STORE_PUBLIC_KEY)
          MOSAIC_BILLING_ENABLED: YES
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/AppStore.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
    scheme:
      testTargets:
        - MosaicTests
        - MosaicUITests
  MosaicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MosaicV3Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: KFH848D5D7
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Mosaic
  MosaicUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MosaicV3UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mosaic
        DEVELOPMENT_TEAM: KFH848D5D7
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - target: Mosaic
